# ==============================================================================
# pipeline_master.conf
# End-to-End Transcriptomic Pipeline Master Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GLOBAL EXECUTION TOGGLES
# Set to "true" to execute a module, "false" to skip.
# ------------------------------------------------------------------------------
RUN_QC="true"
RUN_ALIGNMENT="true"
RUN_DGE="true"
RUN_FUSION="true"
RUN_ALT_SPLICING="true"
RUN_TRANSCRIPT_VARIANTS="true"

# ------------------------------------------------------------------------------
# 2. GLOBAL DIRECTORIES & METADATA
# ------------------------------------------------------------------------------
PIPELINE_HOME="/opt/transcriptomic-pipeline"
RAW_FASTQ_DIR="/data/raw_fastq"
OUTPUT_DIR="/data/pipeline_results"

# Base Metadata Files (User provided)
# Format: SAMPLE_ID \t CONDITION(Tumor/Normal) \t PATIENT_ID \t MATCHED_WITH
BASE_SAMPLE_MANIFEST="/data/metadata/cohort_manifest.tsv"

# Read Group Details for Variant Calling
# Format: SAMPLE \t RGID \t RGLB \t RGPL \t RGPU \t RGSM
BASE_RG_FILE="/data/metadata/rg_details.tsv"

# ------------------------------------------------------------------------------
# 3. REFERENCE GENOMES & DATABASES
# ------------------------------------------------------------------------------
REF_FASTA="/data/references/Homo_sapiens.GRCh38.dna.primary_assembly.fa"
REF_GTF="/data/references/Homo_sapiens.GRCh38.113.gtf"
STAR_INDEX="/data/references/STAR_index"
HISAT2_INDEX_PREFIX="/data/references/HISAT2_index/genome"

# ------------------------------------------------------------------------------
# 4. QC MODULE PARAMETERS
# ------------------------------------------------------------------------------
QC_THREADS=16
QC_PHRED=33
QC_MINLEN=70
QC_LEADING=3
QC_TRAILING=3
QC_SLIDINGWINDOW="4:20"
QC_ADAPTER_FILE="" # Leave empty for auto-detect based on read layout
QC_SINGLE_END="false"
QC_RESUME_MODE="true"

# ------------------------------------------------------------------------------
# 5. ALIGNMENT MODULE PARAMETERS
# ------------------------------------------------------------------------------
ALIGN_THREADS=32
ALIGNER="star" # Options: star, hisat2, both

# ------------------------------------------------------------------------------
# 6. DGE MODULE PARAMETERS
# ------------------------------------------------------------------------------
DGE_MODE="both" # Options: featurecounts, deseq2, both
DGE_THREADS=16
DGE_FC_PAIRED=1
DGE_JUNC=1
DGE_MIN_READ_SUPPORT=10
DGE_LOG2FC=1.0
DGE_PADJ=0.05
DGE_ANNOTATION="gtf"
DGE_DESIGN="paired"

# ------------------------------------------------------------------------------
# 7. FUSION MODULE PARAMETERS
# ------------------------------------------------------------------------------
FUSION_TOOL="both" # Options: starfusion, arriba, both
FUSION_THREADS=16
FUSION_SAMPLE_JOBS=2
FUSION_SKIP_INTERSECTION="false"
FUSION_DEPMAP_DIR="/data/references/DepMap"

# ------------------------------------------------------------------------------
# 8. ALTERNATIVE SPLICING MODULE PARAMETERS
# ------------------------------------------------------------------------------
AS_MODE="group_paired" 
AS_STAGE="complete"
AS_READ_LEN=101
AS_THREADS=32
AS_FDR=0.05
AS_DELTA_PSI=0.1
AS_MIN_READS=10
AS_RECURRENCE_MIN=2

# ------------------------------------------------------------------------------
# 9. TRANSCRIPT VARIANTS MODULE PARAMETERS
# ------------------------------------------------------------------------------
VAR_JOBS=4
VAR_GATK_BIN="/opt/gatk-4.4.0.0/gatk"
VAR_PICARD_JAR="/opt/picard/picard.jar"
VAR_SAMTOOLS_BIN="/usr/local/bin/samtools"

VAR_DBSNP="/data/references/dbsnp_146.hg38.nochr.vcf.gz"
VAR_MILLS="/data/references/Mills_and_1000G_gold_standard.indels.hg38.nochr.vcf.gz"
VAR_GNOMAD="/data/references/gnomad.genomes.v4.1.sites.merged.nochr.vcf.gz"
VAR_PON="/data/references/Somatic_Panel_of_Normals.vcf.gz"

VAR_MARKDUP="true"
VAR_SKIP_PREPROCESSED="true"